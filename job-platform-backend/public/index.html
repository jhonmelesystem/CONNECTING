<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONNECTING - Plataforma de Empleos y Smart Screening</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7216622861306062" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; word-break: break-word; }
        .ad-container {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1px dashed #cbd5e1;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        /* Sistema de Notificaciones Toast Modernas */
        .custom-toast {
            background-color: #1e1e1e;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(20px);
            animation: toastSlideIn 0.3s forwards, toastFadeOut 0.3s 2.7s forwards;
            pointer-events: auto;
            max-width: 300px;
            word-break: break-word;
        }
        .custom-toast.success { background-color: #10b981; }
        .custom-toast.error { background-color: #ef4444; }
        @keyframes toastSlideIn {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastFadeOut {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(20px); }
        }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-900 flex flex-col selection:bg-blue-600 selection:text-white antialiased">

    <!-- NAVEGACIÓN SUPERIOR -->
    <header class="bg-slate-900/95 backdrop-blur-md text-white shadow-xl sticky top-0 z-50 border-b border-slate-800/80">
        <div class="max-w-6xl mx-auto px-2.5 sm:px-6 py-2.5 flex justify-between items-center gap-1.5">
            <div onclick="navigate('home')" class="flex items-center gap-2 cursor-pointer group min-w-0">
                <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl sm:rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-emerald-400 flex items-center justify-center shadow-lg shadow-blue-500/25 shrink-0 group-hover:scale-105 active:scale-95 transition">
                    <span class="text-white font-black text-sm sm:text-lg">⚡</span>
                </div>
                <div class="hidden sm:block min-w-0">
                    <span class="text-sm sm:text-base font-extrabold tracking-tight text-white block leading-none truncate">CONNECTING</span>
                    <span class="text-[9px] font-semibold text-emerald-400 tracking-wider uppercase block mt-0.5 truncate">Smart Hiring RD</span>
                </div>
            </div>
            <div id="nav-actions" class="flex items-center gap-1 sm:gap-2.5 text-[10px] sm:text-xs font-medium shrink-0"></div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main id="main-content" class="max-w-6xl mx-auto px-3 sm:px-6 py-4 sm:py-8 flex-grow w-full animate-fade-in"></main>

    <!-- MODAL DINÁMICO -->
    <div id="job-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md hidden flex items-center justify-center z-50 p-2 sm:p-4 transition-all">
        <div class="bg-white rounded-2xl sm:rounded-3xl max-w-2xl w-full max-h-[94vh] overflow-y-auto p-4 sm:p-8 shadow-2xl relative border border-slate-100 animate-fade-in">
            <button onclick="closeModal()" class="absolute top-3 right-3 sm:top-5 sm:right-5 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 hover:text-slate-900 active:scale-90 transition font-bold text-xs">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- CONTENEDOR DE TOASTS -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-slate-900 text-slate-400 text-center py-5 px-3 text-[11px] sm:text-xs border-t border-slate-800 mt-auto">
        <p class="font-medium">&copy; 2026 CONNECTING. Todos los derechos reservados.</p>
    </footer>

    <script>
        const API_URL = '/api';

        const state = {
            token: localStorage.getItem('token') || null,
            role: localStorage.getItem('role') || null,
            name: localStorage.getItem('name') || null,
            location: localStorage.getItem('location') || '',
            profile_picture: localStorage.getItem('profile_picture') || '',
            currentView: 'home'
        };

        let tempProfilePicBase64 = '';
        let selectedJobRequirements = [];

        // Sistema de Toast Global
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `custom-toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function getModalityBadge(modality) {
            if (modality === 'remoto') {
                return `
                    <span class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200/80 text-[10px] sm:text-[11px] px-2.5 sm:px-3 py-1 rounded-full font-extrabold tracking-wide shadow-sm">
                        <svg class="w-3 h-3 text-emerald-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        Remoto
                    </span>
                `;
            } else if (modality === 'hibrido') {
                return `
                    <span class="inline-flex items-center gap-1.5 bg-purple-50 text-purple-700 border border-purple-200/80 text-[10px] sm:text-[11px] px-2.5 sm:px-3 py-1 rounded-full font-extrabold tracking-wide shadow-sm">
                        <svg class="w-3 h-3 text-purple-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                        Híbrido
                    </span>
                `;
            } else {
                return `
                    <span class="inline-flex items-center gap-1.5 bg-blue-50 text-blue-700 border border-blue-200/80 text-[10px] sm:text-[11px] px-2.5 sm:px-3 py-1 rounded-full font-extrabold tracking-wide shadow-sm">
                        <svg class="w-3 h-3 text-blue-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                        Presencial
                    </span>
                `;
            }
        }

        function updateNav() {
            const nav = document.getElementById('nav-actions');
            if (!nav) return;

            if (state.token) {
                nav.innerHTML = `
                    <div class="flex items-center gap-1 cursor-pointer bg-slate-800/90 px-2 py-1 rounded-lg border border-slate-700/80 active:scale-95 transition" onclick="navigate('profile')" title="Perfil">
                        ${state.profile_picture ? `<img src="${state.profile_picture}" class="w-5 h-5 rounded-full object-cover border border-blue-400 shrink-0">` : '<div class="w-5 h-5 rounded-full bg-blue-600 flex items-center justify-center text-[9px] font-bold text-white shrink-0">👤</div>'}
                    </div>
                    ${state.role === 'employer' ? '<button onclick="navigate(\'my-jobs\')" class="bg-emerald-600 px-2 py-1 rounded-lg text-white font-bold hover:bg-emerald-500 active:scale-95 transition text-[10px] sm:text-xs">Vacantes</button>' : ''}
                    ${state.role === 'employer' ? '<button onclick="navigate(\'create-job\')" class="bg-blue-600 px-2 py-1 rounded-lg text-white font-bold hover:bg-blue-500 active:scale-95 transition text-[10px] sm:text-xs">+ Publicar</button>' : ''}
                    <button onclick="logout()" class="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2 py-1 rounded-lg font-bold hover:bg-rose-500 hover:text-white active:scale-95 transition text-[10px] sm:text-xs">Salir</button>
                `;
            } else {
                nav.innerHTML = `
                    <button onclick="navigate('login')" class="bg-slate-800 text-slate-200 px-2.5 py-1.5 rounded-lg font-bold hover:bg-slate-700 active:scale-95 transition text-[10px] sm:text-xs">Ingresar</button>
                    <button onclick="navigate('register')" class="bg-blue-600 text-white px-2.5 py-1.5 rounded-lg font-bold hover:bg-blue-500 active:scale-95 transition text-[10px] sm:text-xs shadow-sm">Registrarse</button>
                `;
            }
        }

        function navigate(view, params = null) {
            state.currentView = view;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render(params);
        }

        function logout() {
            localStorage.clear();
            state.token = null;
            state.role = null;
            state.name = null;
            state.location = '';
            state.profile_picture = '';
            showToast('Sesión cerrada correctamente');
            navigate('home');
        }

        function render(params = null) {
            updateNav();
            const container = document.getElementById('main-content');
            if (!container) return;
            container.className = 'max-w-6xl mx-auto px-3 sm:px-6 py-4 sm:py-8 flex-grow w-full animate-fade-in';
            container.innerHTML = '';

            switch (state.currentView) {
                case 'home': renderHome(container); break;
                case 'login': renderLogin(container); break;
                case 'register': renderRegister(container); break;
                case 'profile': renderProfile(container); break;
                case 'my-jobs': renderEmployerJobs(container); break;
                case 'create-job': renderCreateJob(container); break;
                case 'edit-job': renderEditJob(container, params); break;
                default: renderHome(container);
            }
        }

        function renderHome(container) {
            container.innerHTML = `
                <!-- BUSCADOR Y FILTROS -->
                <div class="bg-white p-3.5 sm:p-5 rounded-2xl sm:rounded-3xl shadow-sm mb-6 flex flex-col gap-3 border border-slate-200/80">
                    <div class="w-full relative">
                        <input type="text" id="searchInput" placeholder="Buscar por puesto o habilidad..." 
                            class="w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
                        <span class="absolute left-3 top-3 text-slate-400 text-xs sm:text-base">🔍</span>
                    </div>
                    <div class="w-full flex flex-col sm:flex-row gap-2.5">
                        <select id="modalityFilter" class="w-full sm:w-auto border border-slate-200 rounded-xl px-3 py-2.5 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-600 text-xs sm:text-sm text-slate-700 font-semibold">
                            <option value="all">🌐 Todas las modalidades</option>
                            <option value="remoto">💻 Remoto</option>
                            <option value="presencial">🏛️ Presencial</option>
                            <option value="hibrido">⚡ Híbrido</option>
                        </select>
                        <button onclick="fetchFilteredJobs()" class="w-full sm:w-auto bg-blue-600 text-white px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold hover:bg-blue-700 active:scale-95 transition shadow-sm">
                            Buscar
                        </button>
                    </div>
                </div>

                <!-- ENCABEZADO FEED -->
                <div class="mb-4 px-1">
                    <h2 class="text-lg sm:text-2xl font-extrabold tracking-tight text-slate-900">Empleos Disponibles</h2>
                    <p class="text-[11px] sm:text-sm text-slate-500 mt-0.5">Filtrado inteligente con Smart Screening.</p>
                </div>

                <!-- LISTADO DE VACANTES -->
                <div id="jobs-list" class="space-y-3.5">
                    <div class="flex justify-center items-center py-16 bg-white rounded-2xl border border-slate-200/80 shadow-sm">
                        <div class="text-center">
                            <div class="w-7 h-7 border-3 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                            <p class="text-xs text-slate-500 font-semibold">Cargando vacantes...</p>
                        </div>
                    </div>
                </div>
            `;
            fetchFilteredJobs();
        }

        async function fetchFilteredJobs() {
            const search = document.getElementById('searchInput')?.value || '';
            const modality = document.getElementById('modalityFilter')?.value || 'all';
            const listContainer = document.getElementById('jobs-list');

            if (!listContainer) return;

            try {
                const res = await fetch(`${API_URL}/jobs?search=${encodeURIComponent(search)}&modality=${modality}`);
                const jobs = await res.json();

                if (!jobs || jobs.length === 0) {
                    listContainer.innerHTML = `
                        <div class="text-center py-12 bg-white rounded-2xl border border-slate-200/80 shadow-sm px-4">
                            <p class="text-slate-500 font-semibold text-xs sm:text-sm">No se encontraron vacantes disponibles.</p>
                        </div>`;
                    return;
                }

                let html = '';
                jobs.forEach((job, index) => {
                    if (index > 0 && index % 3 === 0) {
                        html += `
                            <div class="ad-container p-4 rounded-2xl shadow-sm mb-3 text-center">
                                <span class="text-[9px] bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-extrabold uppercase tracking-wider">Patrocinado</span>
                                <p class="text-xs font-bold text-slate-800 mt-1.5">🚀 ¡Descubre tecnología avanzada y accesorios en Cinets!</p>
                                <a href="#" class="text-[11px] text-blue-600 hover:underline font-bold mt-0.5 inline-block">Ver gadgets exclusivos</a>
                            </div>
                        `;
                    }

                    const badge = getModalityBadge(job.modality);
                    const jobId = job.id || job._id;

                    html += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 hover:border-slate-300 transition group">
                            <div class="flex justify-between items-start gap-2">
                                <div class="flex items-start gap-2.5 min-w-0">
                                    ${job.employer_logo ? `<img src="${job.employer_logo}" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl object-cover border border-slate-100 shadow-sm shrink-0">` : '<div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-100 flex items-center justify-center font-bold text-slate-500 text-sm shadow-sm shrink-0">🏢</div>'}
                                    <div class="min-w-0">
                                        <h3 class="text-xs sm:text-base font-extrabold text-slate-900 group-hover:text-blue-600 transition truncate">${job.title || 'Sin título'}</h3>
                                        <p class="text-[10px] sm:text-xs font-semibold text-slate-500 mt-0.5 truncate">${job.employer_name || 'Empresa'} • 📍 ${job.location || 'N/A'}</p>
                                    </div>
                                </div>
                                <div class="shrink-0">${badge}</div>
                            </div>
                            <p class="text-slate-600 mt-3 text-xs sm:text-sm line-clamp-2 leading-relaxed">${job.description || ''}</p>
                            <div class="mt-4 flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-2.5 pt-3 border-t border-slate-100">
                                <span class="text-xs sm:text-sm font-extrabold text-emerald-600">${job.salary_range || 'Salario a convenir'}</span>
                                <button onclick="openJobDetail(${jobId})" class="w-full sm:w-auto bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-blue-600 active:scale-95 transition shadow-sm text-center">
                                    Ver Detalle y Postularse
                                </button>
                            </div>
                        </div>
                    `;
                });
                listContainer.innerHTML = html;
            } catch (error) { console.error(error); }
        }

        async function openJobDetail(jobId) {
            const modal = document.getElementById('job-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            content.innerHTML = `
                <div class="text-center py-10">
                    <div class="w-7 h-7 border-3 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                    <p class="text-xs text-slate-500 font-semibold">Evaluando Smart Screening...</p>
                </div>`;

            try {
                const headers = state.token ? { 'Authorization': `Bearer ${state.token}` } : {};
                const res = await fetch(`${API_URL}/jobs/${jobId}`, { headers });
                
                if (!res.ok) {
                    content.innerHTML = `<p class="text-center py-6 text-rose-600 font-semibold text-xs">Error al cargar la vacante.</p>`;
                    return;
                }

                const data = await res.json();
                const job = data.job || {};
                const requirements = data.requirements || [];
                const eligibility = data.eligibility || { canApply: false, matchPercentage: 0 };
                
                const matchScore = eligibility.matchPercentage || 0;
                const satisfiesMatch = matchScore >= 85;

                let reqBadges = requirements.map(r => `
                    <span class="bg-blue-50 text-blue-700 border border-blue-200 text-[11px] px-3 py-1 rounded-xl font-bold">
                        ⚡ ${r.skill_name}
                    </span>
                `).join('');

                content.innerHTML = `
                    <div class="space-y-4">
                        <div class="border-b border-slate-100 pb-3.5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div class="min-w-0">
                                <span class="text-[10px] font-extrabold text-blue-600 uppercase tracking-wider block truncate">${job.employer_name || 'Empresa'}</span>
                                <h2 class="text-base sm:text-xl font-extrabold text-slate-900 mt-0.5 leading-snug">${job.title || 'Vacante'}</h2>
                                <p class="text-[11px] text-slate-500 mt-1 flex flex-wrap items-center gap-1.5">
                                    <span>📍 ${job.location || 'N/A'}</span>
                                    <span>•</span>
                                    <span class="font-bold text-emerald-600">${job.salary_range || 'A convenir'}</span>
                                </p>
                            </div>
                            <div class="shrink-0 self-start sm:self-center">${getModalityBadge(job.modality)}</div>
                        </div>

                        <div>
                            <h4 class="font-bold text-[10px] text-slate-400 uppercase tracking-wider mb-1">Descripción</h4>
                            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed whitespace-pre-line">${job.description || 'Sin descripción.'}</p>
                        </div>

                        <div>
                            <h4 class="font-bold text-[10px] text-slate-400 uppercase tracking-wider mb-1.5">Requisitos Clave</h4>
                            <div class="flex flex-wrap gap-1.5">${reqBadges || '<span class="text-xs text-slate-400 italic">Sin requisitos específicos</span>'}</div>
                        </div>

                        ${state.token && state.role === 'candidate' ? `
                            <div class="p-3.5 rounded-2xl ${satisfiesMatch ? 'bg-emerald-50/80 border border-emerald-200/80' : 'bg-amber-50/80 border border-amber-200/80'}">
                                <div class="flex justify-between items-center mb-1.5">
                                    <span class="text-[11px] font-bold ${satisfiesMatch ? 'text-emerald-900' : 'text-amber-900'}">Coincidencia: ${matchScore}%</span>
                                    <span class="text-[9px] px-2 py-0.5 rounded-lg font-extrabold uppercase ${satisfiesMatch ? 'bg-emerald-200 text-emerald-900' : 'bg-amber-200 text-amber-900'}">
                                        ${satisfiesMatch ? '¡Apto!' : 'Requiere 85%+'}
                                    </span>
                                </div>
                                <div class="w-full bg-slate-200/80 rounded-full h-2 overflow-hidden">
                                    <div class="h-full rounded-full transition-all duration-500 ${satisfiesMatch ? 'bg-emerald-500' : 'bg-amber-500'}" style="width: ${matchScore}%"></div>
                                </div>
                            </div>
                        ` : ''}

                        <div class="pt-2 border-t border-slate-100">
                            ${state.token && state.role === 'candidate' ? `
                                <button onclick="applyToJob(${jobId})" ${!satisfiesMatch ? 'disabled' : ''} 
                                    class="w-full py-3 rounded-xl text-xs sm:text-sm font-bold text-white transition active:scale-95 shadow-md ${satisfiesMatch ? 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-900/20' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}">
                                    ${satisfiesMatch ? 'Enviar Postulación Oficial' : 'No cumples el 85% requerido'}
                                </button>
                            ` : `<p class="text-[11px] text-slate-500 text-center w-full py-1 font-medium">Inicia sesión como Candidato para postularte.</p>`}
                        </div>
                    </div>
                `;
            } catch (err) { 
                console.error(err); 
                content.innerHTML = `<p class="text-center py-6 text-rose-600 text-xs font-semibold">Error al conectar con el servidor.</p>`;
            }
        }

        function closeModal() {
            document.getElementById('job-modal').classList.add('hidden');
        }

        async function applyToJob(jobId) {
            try {
                const res = await fetch(`${API_URL}/jobs/${jobId}/apply`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('¡Postulación enviada exitosamente!');
                    closeModal();
                } else { showToast(data.error || 'Error al postularse', 'error'); }
            } catch (err) { console.error(err); }
        }

        // FUNCIÓN ACTUALIZADA CON BOTONES DE CONTACTO DIRECTO (WHATSAPP Y CORREO)
        async function viewApplicants(jobId) {
            const modal = document.getElementById('job-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            content.innerHTML = `<p class="text-center py-6 text-slate-500 text-xs font-semibold">Cargando candidatos...</p>`;

            try {
                const res = await fetch(`${API_URL}/employer/jobs/${jobId}/applications`, {
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                const applicants = await res.json();

                if (!applicants || applicants.length === 0) {
                    content.innerHTML = `<p class="text-center py-8 text-slate-500 text-xs font-semibold">Aún no hay candidatos postulados.</p>`;
                    return;
                }

                let applicantsHtml = applicants.map(c => {
                    let skillsBadges = c.skills && c.skills.length > 0 
                        ? c.skills.map(s => `<span class="bg-blue-50 text-blue-700 text-[10px] px-2 py-0.5 rounded-lg border border-blue-200/60 font-bold">⚡ ${s.skill_name}</span>`).join('')
                        : '<span class="text-[11px] text-slate-400 italic">Sin habilidades</span>';

                    // Limpieza del número para WhatsApp (solo dígitos)
                    const telefonoLimpio = c.telefono ? c.telefono.replace(/\D/g, '') : '';
                    
                    const mensajeWS = encodeURIComponent(
                        `Hola ${c.name}, vimos tu postulación en CONNECTING y nos gustaría ponernos en contacto contigo.`
                    );

                    return `
                        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col gap-3 mb-3">
                            <div class="flex items-center gap-3">

                                <div class="min-w-0">
                                    <h4 class="font-extrabold text-slate-900 text-xs sm:text-sm truncate">${c.name}</h4>
                                    <p class="text-[11px] text-slate-500 truncate">📧 ${c.email}</p>
                                    <p class="text-[11px] text-slate-500 truncate">📞 ${c.telefono || 'No especificado'}</p>
                                    <p class="text-[9px] text-emerald-600 font-bold mt-0.5">✅ Smart Screening Superado (85%+)</p>
                                </div>
                            </div>
                            <div>
                                <p class="text-[10px] font-bold text-slate-600 mb-1">Habilidades:</p>
                                <div class="flex flex-wrap gap-1">${skillsBadges}</div>
                            </div>
                            
                            <!-- Botones de Contacto Directo para el Reclutador -->
                            <div class="flex gap-2 pt-2 border-t border-slate-100">
                                ${telefonoLimpio ? `
                                    <a href="https://wa.me/${telefonoLimpio}?text=${mensajeWS}" 
                                       target="_blank" 
                                       rel="noopener noreferrer" 
                                       class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white text-center py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm">
                                        💬 WhatsApp
                                    </a>
                                ` : ''}
                                <a href="mailto:${c.email}?subject=Postulación en CONNECTING&body=Hola ${c.name}," 
                                   class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-center py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm">
                                    ✉️ Correo
                                </a>
                            </div>
                        </div>
                    `;
                }).join('');

                content.innerHTML = `
                    <div>
                        <h2 class="text-base font-extrabold text-slate-900 mb-1">Candidatos Postulados (${applicants.length})</h2>
                        <div class="space-y-2.5 max-h-[60vh] overflow-y-auto pr-1 mt-3">
                            ${applicantsHtml}
                        </div>
                    </div>
                `;
            } catch (err) { 
                console.error(err); 
                content.innerHTML = `<p class="text-center py-6 text-rose-600 text-xs font-semibold">Error al cargar los candidatos.</p>`;
            }
        }

        function renderLogin(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-5 sm:p-8 rounded-2xl sm:rounded-3xl shadow-sm border border-slate-200/80 mt-4 animate-fade-in">
                    <h2 class="text-lg sm:text-xl font-extrabold text-slate-900 mb-1 text-center">Iniciar Sesión</h2>
                    <p class="text-[11px] sm:text-xs text-slate-500 text-center mb-5 font-medium">Accede a tu cuenta en CONNECTING</p>
                    <form onsubmit="handleLogin(event)" class="space-y-3.5">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-700 uppercase tracking-wider mb-1">Correo Electrónico</label>
                            <input type="email" id="login-email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-700 uppercase tracking-wider mb-1">Contraseña</label>
                            <input type="password" id="login-password" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl text-xs sm:text-sm font-bold hover:bg-blue-700 active:scale-95 transition shadow-sm">Ingresar</button>
                    </form>
                </div>
            `;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('name', data.name);
                    localStorage.setItem('location', data.location || '');
                    localStorage.setItem('profile_picture', data.profile_picture || '');

                    state.token = data.token;
                    state.role = data.role;
                    state.name = data.name;
                    state.location = data.location || '';
                    state.profile_picture = data.profile_picture || '';

                    showToast('¡Bienvenido de nuevo!');
                    navigate('home');
                } else {
                    showToast(data.error || 'Credenciales incorrectas', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('Error de conexión con el servidor', 'error');
            }
        }

        function renderRegister(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-5 sm:p-8 rounded-2xl sm:rounded-3xl shadow-sm border border-slate-200/80 mt-2 animate-fade-in">
                    <h2 class="text-lg sm:text-xl font-extrabold text-slate-900 mb-1 text-center">Crear Cuenta</h2>
                    <p class="text-[11px] sm:text-xs text-slate-500 text-center mb-5 font-medium">Únete a CONNECTING hoy</p>
                    <form onsubmit="handleRegister(event)" class="space-y-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-700 uppercase tracking-wider mb-1">Tipo de Usuario</label>
                            <select id="reg-role" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold">
                                <option value="candidate">Candidato (Busco Empleo)</option>
                                <option value="employer">Empleador (Contrato Personal)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-700 uppercase tracking-wider mb-1">Nombre Completo o Empresa</label>
                            <input type="text" id="reg-name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-700 uppercase tracking-wider mb-1">Correo Electrónico</label>
                            <input type="email" id="reg-email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-700 uppercase tracking-wider mb-1">Teléfono (Para contacto WhatsApp)</label>
                            <input type="text" id="reg-telefono" placeholder="Ej. 8095551234" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-700 uppercase tracking-wider mb-1">Contraseña</label>
                            <input type="password" id="reg-password" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl text-xs sm:text-sm font-bold hover:bg-blue-700 active:scale-95 transition shadow-sm mt-2">Registrarse</button>
                    </form>
                </div>
            `;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const role = document.getElementById('reg-role').value;
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const telefono = document.getElementById('reg-telefono').value;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role, name, email, telefono, password })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('¡Cuenta creada exitosamente! Inicia sesión.');
                    navigate('login');
                } else {
                    showToast(data.error || 'Error al registrarse', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('Error de conexión', 'error');
            }
        }

        async function renderProfile(container) {
            container.innerHTML = `<div class="text-center py-10"><p class="text-xs text-slate-500">Cargando perfil...</p></div>`;
            try {
                const res = await fetch(`${API_URL}/profile`, {
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                const data = await res.json();
                if (!res.ok) {
                    container.innerHTML = `<p class="text-center py-10 text-rose-600 text-xs">Error al cargar perfil.</p>`;
                    return;
                }

                container.innerHTML = `
                    <div class="max-w-xl mx-auto bg-white p-5 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
                        <h2 class="text-lg font-extrabold text-slate-900 mb-4">Mi Perfil</h2>
                        <div class="space-y-3">
                            <p class="text-xs"><strong>Nombre:</strong> ${data.name || state.name}</p>
                            <p class="text-xs"><strong>Correo:</strong> ${data.email || 'N/A'}</p>
                            <p class="text-xs"><strong>Teléfono:</strong> ${data.telefono || 'No especificado'}</p>
                            <p class="text-xs"><strong>Rol:</strong> ${state.role === 'employer' ? 'Empleador' : 'Candidato'}</p>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error(err);
            }
        }

        async function renderEmployerJobs(container) {
            container.innerHTML = `
                <div class="mb-4 flex justify-between items-center">
                    <h2 class="text-lg font-extrabold text-slate-900">Mis Vacantes Publicadas</h2>
                    <button onclick="navigate('create-job')" class="bg-blue-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold">Nueva Vacante</button>
                </div>
                <div id="employer-jobs-list" class="space-y-3">
                    <p class="text-xs text-slate-500">Cargando tus vacantes...</p>
                </div>
            `;
            try {
                const res = await fetch(`${API_URL}/employer/jobs`, {
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                const jobs = await res.json();
                const list = document.getElementById('employer-jobs-list');

                if (!jobs || jobs.length === 0) {
                    list.innerHTML = `<p class="text-xs text-slate-500">No has publicado ninguna vacante.</p>`;
                    return;
                }

                list.innerHTML = jobs.map(j => `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                            <h3 class="font-extrabold text-sm text-slate-900">${j.title}</h3>
                            <p class="text-[11px] text-slate-500">📍 ${j.location || 'N/A'} • ${j.salary_range || 'A convenir'}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="viewApplicants(${j.id})" class="bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-emerald-700">Ver Postulados</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        function renderCreateJob(container) {
            container.innerHTML = `
                <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h2 class="text-lg font-extrabold text-slate-900 mb-4">Publicar Nueva Vacante</h2>
                    <form onsubmit="handleCreateJob(event)" class="space-y-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-700 uppercase mb-1">Título del Puesto</label>
                            <input type="text" id="job-title" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-700 uppercase mb-1">Descripción</label>
                            <textarea id="job-desc" required rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs"></textarea>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-700 uppercase mb-1">Modalidad</label>
                            <select id="job-modality" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs">
                                <option value="presencial">Presencial</option>
                                <option value="remoto">Remoto</option>
                                <option value="hibrido">Híbrido</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-700 uppercase mb-1">Ubicación</label>
                            <input type="text" id="job-loc" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-700 uppercase mb-1">Rango Salarial</label>
                            <input type="text" id="job-salary" placeholder="Ej. $30,000 - $45,000" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-xl text-xs font-bold hover:bg-blue-700 mt-2">Publicar Vacante</button>
                    </form>
                </div>
            `;
        }

        async function handleCreateJob(e) {
            e.preventDefault();
            const title = document.getElementById('job-title').value;
            const description = document.getElementById('job-desc').value;
            const modality = document.getElementById('job-modality').value;
            const location = document.getElementById('job-loc').value;
            const salary_range = document.getElementById('job-salary').value;

            try {
                const res = await fetch(`${API_URL}/jobs`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.token}`
                    },
                    body: JSON.stringify({ title, description, modality, location, salary_range })
                });
                if (res.ok) {
                    showToast('¡Vacante publicada con éxito!');
                    navigate('my-jobs');
                } else {
                    showToast('Error al publicar vacante', 'error');
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderEditJob(container, jobId) {
            container.innerHTML = `<p class="text-xs text-slate-500 text-center py-10">Función de edición en desarrollo</p>`;
        }

        // Inicializar la app en la vista de inicio
        render();
    </script>
</body>
