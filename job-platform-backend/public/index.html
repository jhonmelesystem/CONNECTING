<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONNECTING - Plataforma de Empleos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .ad-container {
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            border: 1px dashed #cbd5e1;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- NAVEGACIÓN -->
    <header class="bg-gray-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 onclick="navigate('home')" class="text-xl font-bold tracking-wide cursor-pointer hover:text-blue-400 transition flex items-center gap-2">
                ⚡ CONNECTING
            </h1>
            <div id="nav-actions" class="flex items-center gap-3 text-sm"></div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main id="main-content" class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full"></main>

    <!-- MODAL PRINCIPAL -->
    <div id="job-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 shadow-xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-gray-900 text-gray-400 text-center py-4 text-xs mt-auto">
        &copy; 2026 CONNECTING. Todos los derechos reservados.
    </footer>

    <script>
        const API_URL = '/api';

        const state = {
            token: localStorage.getItem('token') || null,
            role: localStorage.getItem('role') || null,
            name: localStorage.getItem('name') || null,
            location: localStorage.getItem('location') || '',
            profile_picture: localStorage.getItem('profile_picture') || '',
            currentView: 'home'
        };

        let tempProfilePicBase64 = '';
        let selectedJobRequirements = [];

        const ACADEMIC_SKILLS = [
            'Bachiller (Educación Secundaria Completa)',
            'Técnico Superior / Tecnólogo',
            'Estudiante Universitario',
            'Grado / Licenciatura Profesional',
            'Postgrado / Maestría / Diplomado'
        ];

        const CORE_CATEGORIES = [
            'Informática (Desarrollo Web & Software)',
            'Informática (Soporte Técnico & Redes)',
            'Informática (Bases de Datos & MySQL)',
            'Marketing Digital (Gestión de Redes & SEO)',
            'Marketing Digital (Publicidad & Campañas Meta/Google)',
            'Marketing Digital (Creación de Contenido & Copywriting)'
        ];

        const OTHER_AREAS_SKILLS = [
            'Atención al Cliente & Telemercadeo',
            'Ventas & Comercial',
            'Contabilidad & Finanzas',
            'Recursos Humanos & Gestión de Personal',
            'Diseño Gráfico & Multimedia',
            'Gestión de Proyectos & Planificación',
            'Logística, Inventario & Almacén',
            'Administración & Recepción',
            'Mantenimiento Técnico & Electromecánica',
            'Conducción, Entrega & Mensajería',
            'Idiomas: Inglés Avanzado / Bilingüe'
        ];

        const SOFT_SKILLS = [
            'Liderazgo', 'Trabajo en Equipo', 'Comunicación Efectiva', 'Resolución de Problemas',
            'Pensamiento Crítico', 'Gestión del Tiempo', 'Adaptabilidad al Cambio', 'Negociación',
            'Orientación a Resultados', 'Empatía y Colaboración', 'Inteligencia Emocional'
        ];

        const EXPERIENCE_LEVELS = [
            { value: 1, label: 'Sin Experiencia / Principiante' },
            { value: 2, label: '1 a 2 años de experiencia' },
            { value: 3, label: '3 a 5 años de experiencia' },
            { value: 4, label: 'Más de 5 años (Senior / Experto)' }
        ];

        const LOCATIONS_LIST = [
            'Santo Domingo, Distrito Nacional', 'Santo Domingo Este', 'Santo Domingo Norte',
            'Santo Domingo Oeste', 'Bajos de Haina, San Cristóbal', 'Santiago de los Caballeros',
            'La Romana', 'Punta Cana / Bávaro', 'San Francisco de Macorís', 'Puerto Plata',
            'Remoto (Global / Internacional)'
        ];

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = function () {
                    tempProfilePicBase64 = reader.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function updateNav() {
            const nav = document.getElementById('nav-actions');
            if (!nav) return;

            if (state.token) {
                nav.innerHTML = `
                    <div class="flex items-center gap-2 mr-2 cursor-pointer" onclick="navigate('profile')">
                        ${state.profile_picture ? `<img src="${state.profile_picture}" class="w-8 h-8 rounded-full object-cover border border-blue-400">` : '<div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-xs font-bold">👤</div>'}
                        <span class="font-medium hidden sm:inline text-gray-200">${state.name || 'Usuario'}</span>
                    </div>
                    <button onclick="navigate('profile')" class="bg-gray-800 px-3 py-1.5 rounded text-white font-medium hover:bg-gray-700 transition">Mi Perfil</button>
                    ${state.role === 'employer' ? '<button onclick="navigate(\'my-jobs\')" class="bg-emerald-600 px-3 py-1.5 rounded text-white font-medium hover:bg-emerald-500 transition">Mis Vacantes</button>' : ''}
                    ${state.role === 'employer' ? '<button onclick="navigate(\'create-job\')" class="bg-blue-600 px-3 py-1.5 rounded text-white font-medium hover:bg-blue-500 transition">+ Publicar</button>' : ''}
                    <button onclick="logout()" class="bg-red-600 px-3 py-1.5 rounded text-white font-medium hover:bg-red-500 transition">Salir</button>
                `;
            } else {
                nav.innerHTML = `
                    <button onclick="navigate('login')" class="bg-blue-800 px-3.5 py-1.5 rounded text-white font-medium hover:bg-blue-700 transition">Entrar</button>
                    <button onclick="navigate('register')" class="bg-emerald-600 px-3.5 py-1.5 rounded text-white font-medium hover:bg-emerald-500 transition">Registrarse</button>
                `;
            }
        }

        function navigate(view, params = null) {
            state.currentView = view;
            render(params);
        }

        function logout() {
            localStorage.clear();
            state.token = null;
            state.role = null;
            state.name = null;
            state.location = '';
            state.profile_picture = '';
            navigate('home');
        }

        function render(params = null) {
            updateNav();
            const container = document.getElementById('main-content');
            if (!container) return;
            container.innerHTML = '';

            switch (state.currentView) {
                case 'home': renderHome(container); break;
                case 'login': renderLogin(container); break;
                case 'register': renderRegister(container); break;
                case 'profile': renderProfile(container); break;
                case 'my-jobs': renderEmployerJobs(container); break;
                case 'create-job': renderCreateJob(container); break;
                case 'edit-job': renderEditJob(container, params); break;
                default: renderHome(container);
            }
        }

        function renderHome(container) {
            container.innerHTML = `
                <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row gap-4 items-center justify-between border border-gray-100">
                    <div class="w-full md:w-1/2 relative">
                        <input type="text" id="searchInput" placeholder="Buscar por puesto, habilidad, Bachiller, Informática..." 
                            class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
                    </div>
                    <div class="w-full md:w-auto flex gap-3">
                        <select id="modalityFilter" class="border rounded-lg px-4 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                            <option value="all">Todas las modalidades</option>
                            <option value="remoto">🟢 Remoto</option>
                            <option value="presencial">🏢 Presencial</option>
                            <option value="hibrido">🔄 Híbrido</option>
                        </select>
                        <button onclick="fetchFilteredJobs()" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">
                            Filtrar
                        </button>
                    </div>
                </div>

                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Empleos Disponibles</h2>
                    <p class="text-sm text-gray-600">Smart Screening integrado para postulaciones exactas.</p>
                </div>

                <div id="jobs-list" class="space-y-4">
                    <p class="text-gray-500 text-center py-8">Cargando vacantes...</p>
                </div>
            `;
            fetchFilteredJobs();
        }

        async function fetchFilteredJobs() {
            const search = document.getElementById('searchInput')?.value || '';
            const modality = document.getElementById('modalityFilter')?.value || 'all';
            const listContainer = document.getElementById('jobs-list');

            if (!listContainer) return;

            try {
                const res = await fetch(`${API_URL}/jobs?search=${encodeURIComponent(search)}&modality=${modality}`);
                const jobs = await res.json();

                if (!jobs || jobs.length === 0) {
                    listContainer.innerHTML = `<p class="text-gray-500 text-center py-10 bg-white rounded-xl shadow-sm">No se encontraron vacantes disponibles.</p>`;
                    return;
                }

                let html = '';
                jobs.forEach((job, index) => {
                    if (index > 0 && index % 3 === 0) {
                        html += `
                            <div class="ad-container p-4 rounded-xl shadow-sm mb-4 text-center">
                                <span class="text-[10px] bg-gray-500 text-white px-2 py-0.5 rounded font-bold uppercase">Patrocinado</span>
                                <p class="text-sm font-semibold text-gray-800 mt-1">🚀 ¡Acelera tu carrera profesional con los mejores equipos en Cinets!</p>
                                <a href="#" class="text-xs text-blue-600 underline font-medium">Ver accesorios y tecnología</a>
                            </div>
                        `;
                    }

                    let badge = '<span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full font-semibold">🏢 Presencial</span>';
                    if (job.modality === 'remoto') badge = '<span class="bg-green-100 text-green-800 text-xs px-2.5 py-1 rounded-full font-semibold">💻 Remoto</span>';
                    if (job.modality === 'hibrido') badge = '<span class="bg-purple-100 text-purple-800 text-xs px-2.5 py-1 rounded-full font-semibold">🔄 Híbrido</span>';

                    html += `
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition">
                            <div class="flex justify-between items-start">
                                <div class="flex items-center gap-3">
                                    ${job.employer_logo ? `<img src="${job.employer_logo}" class="w-10 h-10 rounded-full object-cover">` : '<div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center font-bold text-gray-500">🏢</div>'}
                                    <div>
                                        <h3 class="text-lg font-bold text-gray-900">${job.title}</h3>
                                        <p class="text-sm text-gray-600">${job.employer_name || 'Empresa'} • 📍 ${job.location || 'No especificada'}</p>
                                    </div>
                                </div>
                                <div>${badge}</div>
                            </div>
                            <p class="text-gray-700 mt-3 text-sm line-clamp-2">${job.description}</p>
                            <div class="mt-4 flex justify-between items-center pt-3 border-t border-gray-50">
                                <span class="text-sm font-semibold text-emerald-600">${job.salary_range || 'Salario a convenir'}</span>
                                <button onclick="openJobDetail(${job.id})" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">
                                    Ver Detalle
                                </button>
                            </div>
                        </div>
                    `;
                });
                listContainer.innerHTML = html;
            } catch (error) { console.error(error); }
        }

        async function openJobDetail(jobId) {
            const modal = document.getElementById('job-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            content.innerHTML = `<p class="text-center py-8 text-gray-500">Evaluando compatibilidad con Smart Screening...</p>`;

            try {
                const headers = state.token ? { 'Authorization': `Bearer ${state.token}` } : {};
                const res = await fetch(`${API_URL}/jobs/${jobId}`, { headers });
                const data = await res.json();

                const { job, requirements, eligibility } = data;
                const matchScore = eligibility ? eligibility.matchPercentage : 0;
                const satisfiesMatch = matchScore >= 85;

                let reqBadges = requirements.map(r => `
                    <span class="bg-blue-50 text-blue-800 border border-blue-200 text-xs px-2.5 py-1 rounded-full font-medium">
                        ⚡ ${r.skill_name}
                    </span>
                `).join('');

                content.innerHTML = `
                    <div class="space-y-4">
                        <div class="border-b pb-3">
                            <h2 class="text-2xl font-bold text-gray-900">${job.title}</h2>
                            <p class="text-sm text-gray-600">${job.employer_name} • 📍 ${job.location}</p>
                            <p class="text-emerald-600 font-bold text-sm mt-1">${job.salary_range || 'Salario a convenir'}</p>
                        </div>

                        <div>
                            <h4 class="font-semibold text-sm text-gray-700">Descripción de la Vacante:</h4>
                            <p class="text-sm text-gray-600 mt-1">${job.description}</p>
                        </div>

                        <div>
                            <h4 class="font-semibold text-sm text-gray-700 mb-2">Requisitos Clave Exigidos:</h4>
                            <div class="flex flex-wrap gap-2">${reqBadges || '<span class="text-xs text-gray-400">Sin requisitos específicos</span>'}</div>
                        </div>

                        ${state.token && state.role === 'candidate' ? `
                            <div class="p-4 rounded-xl ${satisfiesMatch ? 'bg-emerald-50 border border-emerald-200' : 'bg-amber-50 border border-amber-200'}">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-sm font-bold ${satisfiesMatch ? 'text-emerald-800' : 'text-amber-800'}">Nivel de Coincidencia: ${matchScore}%</span>
                                    <span class="text-xs px-2 py-0.5 rounded font-bold ${satisfiesMatch ? 'bg-emerald-200 text-emerald-900' : 'bg-amber-200 text-amber-900'}">
                                        ${satisfiesMatch ? '¡Apto para Postularte!' : 'Se requiere al menos 85%'}
                                    </span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-2.5 mt-2">
                                    <div class="h-2.5 rounded-full ${satisfiesMatch ? 'bg-emerald-600' : 'bg-amber-500'}" style="width: ${matchScore}%"></div>
                                </div>
                            </div>
                        ` : ''}

                        <div class="pt-4 flex gap-3 border-t">
                            ${state.token && state.role === 'candidate' ? `
                                <button onclick="applyToJob(${job.id})" ${!satisfiesMatch ? 'disabled' : ''} 
                                    class="w-full py-2.5 rounded-lg text-sm font-bold text-white transition ${satisfiesMatch ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-gray-300 cursor-not-allowed'}">
                                    ${satisfiesMatch ? 'Enviar Postulación' : 'No cumples el 85% requerido'}
                                </button>
                            ` : `<p class="text-xs text-gray-500 text-center w-full">Inicia sesión como Candidato para postularte.</p>`}
                        </div>
                    </div>
                `;
            } catch (err) { console.error(err); }
        }

        function closeModal() {
            document.getElementById('job-modal').classList.add('hidden');
        }

        async function applyToJob(jobId) {
            try {
                const res = await fetch(`${API_URL}/jobs/${jobId}/apply`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    alert('¡Postulación enviada exitosamente!');
                    closeModal();
                } else { alert(data.error); }
            } catch (err) { console.error(err); }
        }

        async
