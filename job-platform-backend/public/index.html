<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONNECTING - Plataforma de Empleos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .ad-container {
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            border: 1px dashed #cbd5e1;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- NAVEGACIÓN -->
    <header class="bg-gray-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 onclick="navigate('home')" class="text-xl font-bold tracking-wide cursor-pointer hover:text-blue-400 transition flex items-center gap-2">
                ⚡ CONNECTING
            </h1>
            <div id="nav-actions" class="flex items-center gap-3 text-sm"></div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main id="main-content" class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full"></main>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-gray-900 text-gray-400 text-center py-4 text-xs mt-auto">
        &copy; 2026 CONNECTING. Todos los derechos reservados.
    </footer>

    <script>
        const API_URL = '/api';

        const state = {
            token: localStorage.getItem('token') || null,
            role: localStorage.getItem('role') || null,
            name: localStorage.getItem('name') || null,
            location: localStorage.getItem('location') || '',
            profile_picture: localStorage.getItem('profile_picture') || '',
            currentView: 'home'
        };

        let tempProfilePicBase64 = '';

        // CATÁLOGOS MASIVOS Y PROFESIONALES DE HABILIDADES, APTITUDES Y EXPERIENCIA
        const TECHNICAL_SKILLS = [
            'JavaScript', 'TypeScript', 'Node.js', 'Express', 'MySQL', 'PostgreSQL', 
            'React', 'Vue.js', 'Angular', 'HTML / CSS', 'Tailwind CSS', 'Python', 
            'Django', 'PHP', 'Laravel', 'Java', 'Spring Boot', 'Flutter', 'React Native',
            'Docker', 'Git / GitHub', 'AWS Cloud', 'Sistemas Operativos', 'Excel Avanzado',
            'Administración de Servidores', 'Soporte Técnico IT', 'Redes y Conectividad'
        ];

        const SOFT_SKILLS = [
            'Liderazgo', 'Trabajo en Equipo', 'Comunicación Efectiva', 'Resolución de Problemas',
            'Pensamiento Crítico', 'Gestión del Tiempo', 'Adaptabilidad al Cambio', 'Negociación',
            'Orientación a Resultados', 'Atención al Cliente', 'Empatía y Colaboración', 'Inteligencia Emocional'
        ];

        const EXPERIENCE_LEVELS = [
            { value: 1, label: 'Menos de 1 año (Junior / Principiante)' },
            { value: 2, label: '1 a 2 años de experiencia' },
            { value: 3, label: '3 a 5 años de experiencia (Intermedio / Semi-Senior)' },
            { value: 4, label: '5 a 8 años de experiencia (Senior)' },
            { value: 5, label: 'Más de 8 años (Expert / Lead / Especialista)' }
        ];

        const LOCATIONS_LIST = [
            'Santo Domingo, Distrito Nacional',
            'Santo Domingo Este',
            'Santo Domingo Norte',
            'Santo Domingo Oeste',
            'Bajos de Haina, San Cristóbal',
            'Santiago de los Caballeros',
            'La Romana',
            'Punta Cana / Bávaro',
            'San Francisco de Macorís',
            'Puerto Plata',
            'Remoto (Global / Internacional)'
        ];

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = function () {
                    tempProfilePicBase64 = reader.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function updateNav() {
            const nav = document.getElementById('nav-actions');
            if (!nav) return;

            if (state.token) {
                nav.innerHTML = `
                    <div class="flex items-center gap-2 mr-2 cursor-pointer" onclick="navigate('profile')">
                        ${state.profile_picture ? `<img src="${state.profile_picture}" class="w-8 h-8 rounded-full object-cover border border-blue-400">` : '<div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-xs font-bold">👤</div>'}
                        <span class="font-medium hidden sm:inline text-gray-200">Hola, ${state.name || 'Usuario'}</span>
                    </div>
                    <button onclick="navigate('profile')" class="bg-gray-800 px-3 py-1.5 rounded text-white font-medium hover:bg-gray-700 transition">Mi Perfil</button>
                    ${state.role === 'employer' ? '<button onclick="navigate(\'my-jobs\')" class="bg-emerald-600 px-3 py-1.5 rounded text-white font-medium hover:bg-emerald-500 transition">Mis Vacantes</button>' : ''}
                    ${state.role === 'employer' ? '<button onclick="navigate(\'create-job\')" class="bg-blue-600 px-3 py-1.5 rounded text-white font-medium hover:bg-blue-500 transition">+ Publicar</button>' : ''}
                    <button onclick="logout()" class="bg-red-600 px-3 py-1.5 rounded text-white font-medium hover:bg-red-500 transition">Salir</button>
                `;
            } else {
                nav.innerHTML = `
                    <button onclick="navigate('login')" class="bg-blue-800 px-3.5 py-1.5 rounded text-white font-medium hover:bg-blue-700 transition">Entrar</button>
                    <button onclick="navigate('register')" class="bg-emerald-600 px-3.5 py-1.5 rounded text-white font-medium hover:bg-emerald-500 transition">Registrarse</button>
                `;
            }
        }

        function navigate(view, params = null) {
            state.currentView = view;
            render(params);
        }

        function logout() {
            localStorage.clear();
            state.token = null;
            state.role = null;
            state.name = null;
            state.location = '';
            state.profile_picture = '';
            navigate('home');
        }

        function render(params = null) {
            updateNav();
            const container = document.getElementById('main-content');
            if (!container) return;
            container.innerHTML = '';

            switch (state.currentView) {
                case 'home': renderHome(container); break;
                case 'login': renderLogin(container); break;
                case 'register': renderRegister(container); break;
                case 'profile': renderProfile(container); break;
                case 'my-jobs': renderEmployerJobs(container); break;
                case 'create-job': renderCreateJob(container); break;
                case 'edit-job': renderEditJob(container, params); break;
                default: renderHome(container);
            }
        }

        // ==================== HOME ====================
        function renderHome(container) {
            container.innerHTML = `
                <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row gap-4 items-center justify-between border border-gray-100">
                    <div class="w-full md:w-1/2 relative">
                        <input type="text" id="searchInput" placeholder="Buscar por puesto, habilidad o sector..." 
                            class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
                    </div>
                    <div class="w-full md:w-auto flex gap-3">
                        <select id="modalityFilter" class="border rounded-lg px-4 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                            <option value="all">Todas las modalidades</option>
                            <option value="remoto">🟢 Remoto</option>
                            <option value="presencial">🏢 Presencial</option>
                            <option value="hibrido">🔄 Híbrido</option>
                        </select>
                        <button onclick="fetchFilteredJobs()" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">
                            Filtrar
                        </button>
                    </div>
                </div>

                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Empleos Disponibles</h2>
                    <p class="text-sm text-gray-600">Conectando talento dominicano y global con empresas líderes.</p>
                </div>

                <div id="jobs-list" class="space-y-4">
                    <p class="text-gray-500 text-center py-8">Cargando vacantes...</p>
                </div>
            `;
            fetchFilteredJobs();
        }

        async function fetchFilteredJobs() {
            const search = document.getElementById('searchInput')?.value || '';
            const modality = document.getElementById('modalityFilter')?.value || 'all';
            const listContainer = document.getElementById('jobs-list');

            if (!listContainer) return;

            try {
                const res = await fetch(`${API_URL}/jobs?search=${encodeURIComponent(search)}&modality=${modality}`);
                const jobs = await res.json();

                if (!jobs || jobs.length === 0) {
                    listContainer.innerHTML = `<p class="text-gray-500 text-center py-10 bg-white rounded-xl shadow-sm">No se encontraron vacantes disponibles.</p>`;
                    return;
                }

                let html = '';
                jobs.forEach((job, index) => {
                    if (index > 0 && index % 3 === 0) {
                        html += `
                            <div class="ad-container p-4 rounded-xl shadow-sm mb-4 text-center">
                                <span class="text-[10px] bg-gray-500 text-white px-2 py-0.5 rounded font-bold uppercase">Patrocinado</span>
                                <p class="text-sm font-semibold text-gray-800 mt-1">🚀 ¡Acelera tu carrera con tecnología de vanguardia!</p>
                                <a href="#" class="text-xs text-blue-600 underline font-medium">Conoce nuestras ofertas exclusivas</a>
                            </div>
                        `;
                    }

                    let badge = '<span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full font-semibold">🏢 Presencial</span>';
                    if (job.modality === 'remoto') badge = '<span class="bg-green-100 text-green-800 text-xs px-2.5 py-1 rounded-full font-semibold">💻 Remoto</span>';
                    if (job.modality === 'hibrido') badge = '<span class="bg-purple-100 text-purple-800 text-xs px-2.5 py-1 rounded-full font-semibold">🔄 Híbrido</span>';

                    html += `
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition">
                            <div class="flex justify-between items-start">
                                <div class="flex items-center gap-3">
                                    ${job.employer_logo ? `<img src="${job.employer_logo}" class="w-10 h-10 rounded-full object-cover">` : '<div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center font-bold text-gray-500">🏢</div>'}
                                    <div>
                                        <h3 class="text-lg font-bold text-gray-900">${job.title}</h3>
                                        <p class="text-sm text-gray-600">${job.employer_name || 'Empresa'} • 📍 ${job.location || 'No especificada'}</p>
                                    </div>
                                </div>
                                <div>${badge}</div>
                            </div>
                            <p class="text-gray-700 mt-3 text-sm line-clamp-2">${job.description}</p>
                            <div class="mt-4 flex justify-between items-center pt-3 border-t border-gray-50">
                                <span class="text-sm font-semibold text-emerald-600">${job.salary_range || 'Salario a convenir'}</span>
                                <button onclick="alert('Inicia sesión para postularte')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">
                                    Ver Detalle
                                </button>
                            </div>
                        </div>
                    `;
                });
                listContainer.innerHTML = html;
            } catch (error) {
                console.error(error);
            }
        }

        // ==================== AUTH ====================
        function renderLogin(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-sm border border-gray-100 mt-8">
                    <h2 class="text-xl font-bold mb-4 text-center">Iniciar Sesión</h2>
                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
                            <input type="email" id="login-email" required class="w-full border rounded-lg px-3 py-2 mt-1">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                            <input type="password" id="login-password" required class="w-full border rounded-lg px-3 py-2 mt-1">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">Ingresar</button>
                    </form>
                </div>
            `;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('name', data.name);
                    localStorage.setItem('location', data.location || '');
                    localStorage.setItem('profile_picture', data.profile_picture || '');

                    state.token = data.token;
                    state.role = data.role;
                    state.name = data.name;
                    state.location = data.location || '';
                    state.profile_picture = data.profile_picture || '';

                    navigate('home');
                } else { alert(data.error); }
            } catch (err) { console.error(err); }
        }

        function renderRegister(container) {
            tempProfilePicBase64 = '';
            let locationOptions = LOCATIONS_LIST.map(l => `<option value="${l}">${l}</option>`).join('');

            container.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-sm border border-gray-100 mt-4">
                    <h2 class="text-xl font-bold mb-4 text-center">Crear Cuenta</h2>
                    <form onsubmit="handleRegister(event)" class="space-y-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Nombre Completo / Empresa</label>
                            <input type="text" id="reg-name" required class="w-full border rounded-lg px-3 py-1.5 mt-1">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
                            <input type="email" id="reg-email" required class="w-full border rounded-lg px-3 py-1.5 mt-1">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                            <input type="password" id="reg-password" required class="w-full border rounded-lg px-3 py-1.5 mt-1">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Tipo de Cuenta</label>
                            <select id="reg-role" class="w-full border rounded-lg px-3 py-1.5 mt-1 bg-white">
                                <option value="candidate">Busco Empleo (Candidato)</option>
                                <option value="employer">Deseo Publicar Empleos (Empleador)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Ubicación / Sector</label>
                            <select id="reg-location" class="w-full border rounded-lg px-3 py-1.5 mt-1 bg-white">
                                ${locationOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Foto de Perfil</label>
                            <input type="file" accept="image/*" onchange="handleImageUpload(event)" class="w-full border rounded-lg px-3 py-1.5 mt-1 text-sm bg-white">
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-medium hover:bg-emerald-700 transition">Registrarse</button>
                    </form>
                </div>
            `;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;
            const location = document.getElementById('reg-location').value;

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role, location, profile_picture: tempProfilePicBase64 })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('¡Registro exitoso! Inicia sesión.');
                    navigate('login');
                } else { alert(data.error); }
            } catch (err) { console.error(err); }
        }

        // ==================== APARTADO DE PERFIL DINÁMICO (CANDIDATO / EMPLEADOR) ====================
        async function renderProfile(container) {
            tempProfilePicBase64 = state.profile_picture;
            let locationOptions = LOCATIONS_LIST.map(l => `<option value="${l}" ${state.location === l ? 'selected' : ''}>${l}</option>`).join('');
            let techOptions = TECHNICAL_SKILLS.map(s => `<option value="${s}">${s}</option>`).join('');
            let softOptions = SOFT_SKILLS.map(s => `<option value="${s}">${s}</option>`).join('');
            let expOptions = EXPERIENCE_LEVELS.map(e => `<option value="${e.value}">${e.label}</option>`).join('');

            container.innerHTML = `
                <div class="max-w-2xl mx-auto space-y-6">
                    <!-- Configuración General del Perfil -->
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="text-xl font-bold mb-4">Editar Perfil (${state.role === 'candidate' ? 'Candidato' : 'Empleador'})</h2>
                        <form onsubmit="handleUpdateProfile(event)" class="space-y-4">
                            <div class="flex items-center gap-4 mb-4">
                                ${state.profile_picture ? `<img src="${state.profile_picture}" class="w-16 h-16 rounded-full object-cover border">` : '<div class="w-16 h-16 rounded-full bg-gray-200 flex items-center justify-center font-bold text-xl">👤</div>'}
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Cambiar Foto de Perfil</label>
                                    <input type="file" accept="image/*" onchange="handleImageUpload(event)" class="text-sm mt-1">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Nombre / Empresa</label>
                                <input type="text" id="prof-name" value="${state.name || ''}" required class="w-full border rounded-lg px-3 py-2 mt-1">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Ubicación / Sector</label>
                                <select id="prof-location" class="w-full border rounded-lg px-3 py-2 mt-1 bg-white">
                                    ${locationOptions}
                                </select>
                            </div>
                            <button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700 transition">Guardar Cambios</button>
                        </form>
                    </div>

                    <!-- Si es Candidato, gestionar Habilidades, Aptitudes y Experiencia -->
                    ${state.role === 'candidate' ? `
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <h3 class="text-lg font-bold mb-3">Mis Habilidades y Aptitudes Profesionales</h3>
                        <p class="text-sm text-gray-600 mb-4">Selecciona de nuestra lista estandarizada para matchear con los empleadores.</p>
                        
                        <div class="space-y-3">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Habilidad / Aptitud</label>
                                <select id="skill-name" class="w-full border rounded-lg px-3 py-2 mt-1 bg-white">
                                    <optgroup label="Habilidades Técnicas">
                                        ${techOptions}
                                    </optgroup>
                                    <optgroup label="Aptitudes (Soft Skills)">
                                        ${softOptions}
                                    </optgroup>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Años de Experiencia</label>
                                <select id="skill-exp" class="w-full border rounded-lg px-3 py-2 mt-1 bg-white">
                                    ${expOptions}
                                </select>
                            </div>
                            <button onclick="addUserSkill()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-emerald-700">+ Agregar a mi Perfil</button>
                        </div>
                    </div>` : ''}
                </div>
            `;
        }

        async function handleUpdateProfile(e) {
            e.preventDefault();
            const name = document.getElementById('prof-name').value;
            const location = document.getElementById('prof-location').value;

            try {
                const res = await fetch(`${API_URL}/profile`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.token}`
                    },
                    body: JSON.stringify({ name, location, profile_picture: tempProfilePicBase64 })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('name', data.user.name);
                    localStorage.setItem('location', data.user.location);
                    localStorage.setItem('profile_picture', data.user.profile_picture);
                    state.name = data.user.name;
                    state.location = data.user.location;
                    state.profile_picture = data.user.profile_picture;
                    alert('¡Perfil actualizado con éxito!');
                    renderProfile(document.getElementById('main-content'));
                    updateNav();
                } else { alert(data.error); }
            } catch (err) { console.error(err); }
        }

        async function addUserSkill() {
            const skill_name = document.getElementById('skill-name').value;
            const experience_years = document.getElementById('skill-exp').value;

            try {
                const res = await fetch(`${API_URL}/skills`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.token}`
                    },
                    body: JSON.stringify({ skill_name, experience_years: parseInt(experience_years) })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('¡Habilidad/Aptitud guardada en tu perfil!');
                } else { alert(data.error); }
            } catch (err) { console.error(err); }
        }

        // ==================== EMPLEADOR: GESTIÓN Y EDICIÓN DE VACANTES ====================
        async function renderEmployerJobs(container) {
            container.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Mis Vacantes Publicadas</h2>
                    <button onclick="navigate('create-job')" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700">+ Nueva Vacante</button>
                </div>
                <div id="employer-jobs-list" class="space-y-4">
                    <p class="text-gray-500 text-center py-8">Cargando vacantes...</p>
                </div>
            `;

            try {
                const res = await fetch(`${API_URL}/employer/jobs`, {
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                const jobs = await res.json();
                const listContainer = document.getElementById('employer-jobs-list');

                if (!jobs || jobs.length === 0) {
                    listContainer.innerHTML = `<p class="text-gray-500 text-center py-8 bg-white rounded-xl">No has publicado vacantes aún.</p>`;
                    return;
                }

                let html = '';
                jobs.forEach(job => {
                    html += `
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <h3 class="text-lg font-bold text-gray-900">${job.title}</h3>
                                <p class="text-sm text-gray-600">Modalidad: <span class="capitalize font-medium">${job.modality}</span> • Ubicación: ${job.location || 'N/A'}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="navigate('edit-job', ${job.id})" class="bg-amber-100 text-amber-700 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-amber-200">Editar</button>
                                <button onclick="deleteJob(${job.id})" class="bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-red-200">Eliminar</button>
                            </div>
                        </div>
                    `;
                });
                listContainer.innerHTML = html;
            } catch (err) { console.error(err); }
        }

        function renderCreateJob(container) {
            let techOptions = TECHNICAL_SKILLS.map(s => `<option value="${s}">${s}</option>`).join('');
            let softOptions = SOFT_SKILLS.map(s => `<option value="${s}">${s}</option>`).join('');
            let locationOptions = LOCATIONS_LIST.map(l => `<option value="${l}">${l}</option>`).join('');

            container.innerHTML = `
                <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-bold mb-4">Publicar Nueva Vacante con Smart Screening</h2>
                    <form onsubmit="handleCreateJob(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Título del Puesto</label>
                            <input type="text" id="job-title" required class="w-full border rounded-lg px-3 py-2 mt-1">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Modalidad</label>
                                <select id="job-modality" class="w-full border rounded-lg px-3 py-2 mt-1 bg-white">
                                    <option value="presencial">Presencial</option>
                                    <option value="remoto">Remoto</option>
                                    <option value="hibrido">Híbrido</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Ubicación / Sector</label>
                                <select id="job-location" class="w-full border rounded-lg px-3 py-2 mt-1 bg-white">
                                    ${locationOptions}
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Rango Salarial</label>
                            <input type="text" id="job-salary" placeholder="Ej: $45,000 - $60,000 DOP" class="w-full border rounded-lg px-3 py-2 mt-1">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Descripción del Puesto</label>
                            <textarea id="job-desc" rows="4" required class="w-full border rounded-lg px-3 py-2 mt-1"></textarea>
                        </div>
                        <div class="p-4 bg-gray-50 rounded-lg border">
                            <label class="block text-sm font-semibold text-gray-800 mb-1">Requisito Obligatorio (Habilidad / Aptitud Clave)</label>
                            <select id="req-skill" class="w-full border rounded-lg px-3 py-2 bg-white text-sm mb-2">
                                <optgroup label="Técnicas">${techOptions}</optgroup>
                                <optgroup label="Aptitudes">${softOptions}</optgroup>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">Publicar Vacante</button>
                    </form>
                </div>
            `;
        }

        async function handleCreateJob(e) {
            e.preventDefault();
            const title = document.getElementById('job-title').value;
            const modality = document.getElementById('job-modality').value;
            const location = document.getElementById('job-location').value;
            const salary_range = document.getElementById('job-salary').value;
            const description = document.getElementById('job-desc').value;
            const reqSkill = document.getElementById('req-skill').value;

            const requirements = [{ skill_name: reqSkill, level_required: 1 }];

            try {
                const res = await fetch(`${API_URL}/jobs`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.token}`
                    },
                    body: JSON.stringify({ title, modality, location, salary_range, description, requirements })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('¡Vacante publicada con éxito!');
                    navigate('my-jobs');
                } else { alert(data.error); }
            } catch (err) { console.error(err); }
        }

        // ==================== EDITAR VACANTE ====================
        async function renderEditJob(container, jobId) {
            try {
                const res = await fetch(`${API_URL}/employer/jobs`, {
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                const jobs = await res.json();
                const job = jobs.find(j => j.id === jobId);

                if (!job) {
                    alert('Vacante no encontrada');
                    navigate('my-jobs');
                    return;
                }

                let locationOptions = LOCATIONS_LIST.map(l => `<option value="${l}" ${job.location === l ? 'selected' : ''}>${l}</option>`).join('');

                container.innerHTML = `
                    <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="text-xl font-bold mb-4">Editar Vacante: ${job.title}</h2>
                        <form onsubmit="handleEditJob(event, ${job.id})" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Título del Puesto</label>
                                <input type="text" id="edit-title" value="${job.title}" required class="w-full border rounded-lg px-3 py-2 mt-1">
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Modalidad</label>
                                    <select id="edit-modality" class="w-full border rounded-lg px-3 py-2 mt-1 bg-white">
                                        <option value="presencial" ${job.modality === 'presencial' ? 'selected' : ''}>Presencial</option>
                                        <option value="remoto" ${job.modality === 'remoto' ? 'selected' : ''}>Remoto</option>
                                        <option value="hibrido" ${job.modality === 'hibrido' ? 'selected' : ''}>Híbrido</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Ubicación / Sector</label>
                                    <select id="edit-location" class="w-full border rounded-lg px-3 py-2 mt-1 bg-white">
                                        ${locationOptions}
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Rango Salarial</label>
                                <input type="text" id="edit-salary" value="${job.salary_range || ''}" class="w-full border rounded-lg px-3 py-2 mt-1">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Descripción</label>
                                <textarea id="edit-desc" rows="4" required class="w-full border rounded-lg px-3 py-2 mt-1">${job.description}</textarea>
                            </div>
                            <div class="flex gap-3">
                                <button type="submit" class="flex-grow bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">Guardar Cambios</button>
                                <button type="button" onclick="navigate('my-jobs')" class="bg-gray-300 px-4 py-2 rounded-lg font-medium hover:bg-gray-400">Cancelar</button>
                            </div>
                        </form>
                    </div>
                `;
            } catch (err) { console.error(err); }
        }

        async function handleEditJob(e, jobId) {
            e.preventDefault();
            const title = document.getElementById('edit-title').value;
            const modality = document.getElementById('edit-modality').value;
            const location = document.getElementById('edit-location').value;
            const salary_range = document.getElementById('edit-salary').value;
            const description = document.getElementById('edit-desc').value;

            try {
                const res = await fetch(`${API_URL}/jobs/${jobId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.token}`
                    },
                    body: JSON.stringify({ title, modality, location, salary_range, description })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('¡Vacante actualizada correctamente!');
                    navigate('my-jobs');
                } else { alert(data.error); }
            } catch (err) { console.error(err); }
        }

        async function deleteJob(jobId) {
            if (!confirm('¿Deseas eliminar esta vacante?')) return;
            try {
                const res = await fetch(`${API_URL}/jobs/${jobId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    alert(data.message);
                    renderEmployerJobs(document.getElementById('main-content'));
                } else { alert(data.error); }
            } catch (err) { console.error(err); }
        }

        document.addEventListener('DOMContentLoaded', () => { render(); });
    </script>
</body>
</html>
